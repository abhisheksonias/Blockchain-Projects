<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Letter of Credit DApp</title>
    <link rel="stylesheet" href="styles.css">

</head>
<body>
    <header>
        <div class="container">
            <h1>Letter of Credit Management System</h1>
            <div class="network-status">
                <div id="statusIndicator" class="status-indicator disconnected"></div>
                <span id="connectionStatus">Disconnected</span>
                <span id="accountInfo" style="margin-left: auto;"></span>
            </div>
        </div>
    </header>
    
    <div class="container">
        <div id="notification"></div>
        
        <div class="card">
            <h2 class="card-title">Connect to MetaMask</h2>
            <button id="connectWallet">Connect Wallet</button>
        </div>
        
        <div class="grid">
            <div class="card">
                <h2 class="card-title">Request Letter of Credit</h2>
                <form id="requestForm">
                    <div class="form-group">
                        <label for="expiryDate">Expiry Date (Unix Timestamp)</label>
                        <input type="number" id="expiryDate" required>
                    </div>
                    <div class="form-group">
                        <label for="buyer">Buyer Address</label>
                        <input type="text" id="buyer" required>
                    </div>
                    <div class="form-group">
                        <label for="bank">Bank Address</label>
                        <input type="text" id="bank" required>
                    </div>
                    <div class="form-group">
                        <label for="seller">Seller Address</label>
                        <input type="text" id="seller" required>
                    </div>
                    <div class="form-group">
                        <label for="amount">Amount (in Wei)</label>
                        <input type="number" id="amount" required>
                    </div>
                    <button type="submit">Request Letter of Credit</button>
                </form>
            </div>
            
            <div class="card">
                <h2 class="card-title">Manage Letters of Credit</h2>
                <div class="form-group">
                    <label for="letterId">Letter ID</label>
                    <input type="number" id="letterId">
                    <button id="viewLetter" style="margin-top: 10px;">View Details</button>
                </div>
                
                <div id="letterDetails" style="margin-top: 20px; display: none;">
                    <h3>Letter of Credit Details</h3>
                    <table>
                        <tr>
                            <th>ID</th>
                            <td id="detail-id"></td>
                        </tr>
                        <tr>
                            <th>Expiry Date</th>
                            <td id="detail-expiry"></td>
                        </tr>
                        <tr>
                            <th>Buyer</th>
                            <td id="detail-buyer"></td>
                        </tr>
                        <tr>
                            <th>Bank</th>
                            <td id="detail-bank"></td>
                        </tr>
                        <tr>
                            <th>Seller</th>
                            <td id="detail-seller"></td>
                        </tr>
                        <tr>
                            <th>Amount</th>
                            <td id="detail-amount"></td>
                        </tr>
                        <tr>
                            <th>Status</th>
                            <td id="detail-status"></td>
                        </tr>
                    </table>
                    
                    <div class="actions">
                        <button id="issueLetter" class="btn-success">Issue Letter</button>
                        <button id="acceptLetter" class="btn-success">Accept Letter</button>
                    </div>
                </div>
            </div>
        </div>
        
        <div class="card">
            <h2 class="card-title">Letter of Credit Registry</h2>
            <div id="letterRegistry">
                <div class="form-group">
                    <button id="loadLetters">Load Letters</button>
                </div>
                <table id="lettersTable" style="display: none;">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Buyer</th>
                            <th>Seller</th>
                            <th>Amount</th>
                            <th>Status</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="lettersTableBody">
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/web3/1.8.2/web3.min.js"></script>
    <script src="app.js">
      
    </script>
</body>
</html>
