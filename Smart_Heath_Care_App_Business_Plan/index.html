<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Healthcare DApp</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Healthcare Appointment System</h1>
            <div id="account-status">
                <p>Wallet: <span id="wallet-address">Not connected</span></p>
                <button id="connect-wallet">Connect Wallet</button>
            </div>
        </header>

        <div class="sections-container">
            <section id="book-appointment" class="card">
                <h2>Book New Appointment</h2>
                <div class="form-group">
                    <label for="doctor-address">Doctor's Wallet Address:</label>
                    <input type="text" id="doctor-address" placeholder="0x...">
                </div>
                <div class="form-group">
                    <label for="appointment-payment">Payment Amount (ETH):</label>
                    <input type="number" id="appointment-payment" min="0.001" step="0.001" value="0.01">
                </div>
                <button id="book-btn" class="primary-btn">Book Appointment</button>
                <div id="booking-status" class="status-message"></div>
            </section>

            <section id="my-appointments" class="card">
                <h2>My Appointments</h2>
                <button id="refresh-appointments" class="secondary-btn">Refresh</button>
                <div id="appointments-list">
                    <p class="no-data">No appointments found. Please connect your wallet.</p>
                </div>
            </section>

            <section id="appointment-details" class="card">
                <h2>Appointment Details</h2>
                <div class="form-group">
                    <label for="appointment-id">Appointment ID:</label>
                    <input type="number" id="appointment-id" min="1">
                    <button id="fetch-details-btn" class="secondary-btn">Fetch Details</button>
                </div>
                <div id="appointment-info" class="hidden">
                    <div class="info-item">
                        <strong>Patient:</strong> <span id="detail-patient"></span>
                    </div>
                    <div class="info-item">
                        <strong>Doctor:</strong> <span id="detail-doctor"></span>
                    </div>
                    <div class="info-item">
                        <strong>Date:</strong> <span id="detail-timestamp"></span>
                    </div>
                    <div class="info-item">
                        <strong>Payment Status:</strong> <span id="detail-paid"></span>
                    </div>
                    <div id="payment-section" class="hidden">
                        <div class="form-group">
                            <label for="payment-amount">Payment Amount (ETH):</label>
                            <input type="number" id="payment-amount" min="0.001" step="0.001" value="0.01">
                        </div>
                        <button id="make-payment-btn" class="primary-btn">Make Payment</button>
                    </div>
                </div>
                <div id="detail-status" class="status-message"></div>
            </section>
        </div>

        <div id="transaction-history" class="card">
            <h2>Recent Transactions</h2>
            <div id="transactions-list">
                <p class="no-data">No transactions yet</p>
            </div>
        </div>
    </div>

    <footer>
        <p>Healthcare DApp powered by Ethereum • <span id="contract-address"></span></p>
    </footer>

    <!-- Load Web3 and application scripts -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/web3/1.8.2/web3.min.js"></script>
    <script src="app.js"></script>
</body>
</html>
