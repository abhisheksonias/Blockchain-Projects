<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Smart Healthcare dApp</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/web3/1.6.0/web3.min.js"></script>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="container">
    <h1 class="title">Smart Healthcare dApp</h1>

    <!-- Book Appointment Section -->
    <div class="card" id="bookAppointment">
      <h2>Book Appointment</h2>
      <label for="doctorAddress">Doctor Address:</label>
      <input type="text" id="doctorAddress" placeholder="Enter Doctor's Address">
      <label for="paymentAmount">Payment Amount (ETH):</label>
      <input type="number" id="paymentAmount" placeholder="Amount in ETH" min="0.1">
      <button class="btn" onclick="bookAppointment()">Book Appointment</button>
      <div id="bookStatus"></div>
    </div>

    <!-- Make Payment Section -->
    <div class="card" id="makePayment">
      <h2>Make Payment</h2>
      <label for="appointmentId">Appointment ID:</label>
      <input type="number" id="appointmentId" placeholder="Enter Appointment ID">
      <label for="paymentAmount2">Payment Amount (ETH):</label>
      <input type="number" id="paymentAmount2" placeholder="Amount in ETH" min="0.1">
      <button class="btn" onclick="makePayment()">Make Payment</button>
      <div id="paymentStatus"></div>
    </div>

    <!-- Get Appointment Details Section -->
    <div class="card" id="getAppointmentDetails">
      <h2>Appointment Details</h2>
      <label for="appointmentIdDetails">Appointment ID:</label>
      <input type="number" id="appointmentIdDetails" placeholder="Enter Appointment ID">
      <button class="btn" onclick="getAppointmentDetails()">Get Details</button>
      <div id="appointmentInfo"></div>
    </div>

  </div>

</body>
</html>
